version: 2

models:
  - name: fct_events_daily
    description: >
      Daily activity, one row per calendar day (UTC). Built from stg_events,
      deduplicated on event_id (mobile replays) keeping the earliest
      ingested_at per event.
    columns:
      - name: activity_date
        description: Calendar day (UTC) the events occurred on.
        data_tests: [unique, not_null]
      - name: active_users
        description: Number of distinct users with at least one event that day.
        data_tests: [not_null]
      - name: event_count
        description: Number of events that day, after deduplicating mobile replays on event_id.
        data_tests: [not_null]
