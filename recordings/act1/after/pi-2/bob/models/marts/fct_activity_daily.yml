version: 2

models:
  - name: fct_activity_daily
    description: >
      One row per day. Number of distinct active users and number of events,
      deduplicated on event_id (mobile replays collapsed, keeping the earliest
      ingested_at).
    columns:
      - name: activity_date
        description: Calendar day (UTC), truncated from event_ts.
        data_tests: [unique, not_null]
      - name: active_users
        description: Count of distinct users with at least one event that day.
        data_tests: [not_null]
      - name: event_count
        description: Count of deduplicated events that day.
        data_tests: [not_null]
