version: 2

models:
  - name: fct_activity_daily
    description: Daily product activity, one row per UTC calendar day. Built from stg_events after deduplicating on event_id (earliest ingested_at kept).
    columns:
      - name: event_date
        description: Calendar day of the event in UTC.
        data_tests: [unique, not_null]
      - name: active_users
        description: Number of distinct users with at least one event on the day.
      - name: event_count
        description: Number of distinct events (after deduplication) on the day.
