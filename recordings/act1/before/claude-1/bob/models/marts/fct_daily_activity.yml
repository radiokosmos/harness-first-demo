version: 2

models:
  - name: fct_daily_activity
    description: >
      One row per UTC day with the number of distinct active users and the number
      of distinct events. Built from stg_events, deduplicated on event_id
      (earliest ingested_at kept) to remove mobile replays.
    columns:
      - name: activity_date
        description: UTC calendar day of event_ts.
        data_tests: [unique, not_null]
      - name: active_users
        description: Distinct user_id with at least one event on the day.
      - name: event_count
        description: Distinct events (by event_id) on the day.
