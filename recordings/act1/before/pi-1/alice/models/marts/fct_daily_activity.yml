version: 2

models:
  - name: fct_daily_activity
    description: >
      One row per calendar day, built from stg_events (deduplicated on event_id,
      keeping the earliest ingested_at). Counts distinct active users and total
      events per day.
    columns:
      - name: activity_date
        description: Calendar day (UTC) the events happened on.
        data_tests: [unique, not_null]
      - name: active_users
        description: Number of distinct users with at least one event on this day.
      - name: event_count
        description: Number of deduplicated events on this day.
