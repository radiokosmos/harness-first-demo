version: 2

models:
  - name: fct_daily_activity
    description: One row per calendar day (UTC). Event replays from mobile clients are deduped on event_id, keeping the earliest ingested_at.
    columns:
      - name: activity_date
        description: Calendar day (UTC) derived from event_ts.
        data_tests: [unique, not_null]
      - name: active_users
        description: Number of distinct users with at least one event that day.
        data_tests: [not_null]
      - name: event_count
        description: Number of distinct events (deduped) that day.
        data_tests: [not_null]
