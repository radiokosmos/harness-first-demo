# The session time zone below is deliberate. Like many real warehouse accounts,
# this one has a non-UTC default that someone set years ago. Data is UTC.
harness_demo:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DEMO_DB', 'demo.duckdb') }}"
      threads: 1
      settings:
        TimeZone: America/Los_Angeles
    prod:
      type: duckdb
      path: "{{ env_var('DEMO_PROD_DB', 'prod.duckdb') }}"
      threads: 1
      settings:
        TimeZone: America/Los_Angeles
